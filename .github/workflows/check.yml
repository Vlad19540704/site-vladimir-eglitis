name: Site checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: npm install --prefix output/qa-tools --no-save axe-core@4.13.0
      - run: python -m compileall -q scripts
      - run: python scripts/test_release_safety.py
      - run: |
          python -m http.server 8080 --bind 127.0.0.1 --directory site > /tmp/site-preview.log 2>&1 &
          python scripts/verify_site.py
      - run: python scripts/build_release.py --domain eglitisonline.com --preview
      - run: python scripts/verify_release.py release/eglitisonline.com-preview
      - run: |
          python -m http.server 8082 --bind 127.0.0.1 --directory release/eglitisonline.com-preview > /tmp/release-preview.log 2>&1 &
          python scripts/audit_site.py --base http://127.0.0.1:8082/ --output output/playwright/ci --quick --engines chromium firefox webkit --no-clicks
